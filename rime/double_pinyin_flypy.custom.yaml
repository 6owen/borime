# Rime schema patch: bilingual Chinese-English candidates
# Shift+space commits the highlighted candidate and its visible English comment.
# Control+Shift+B toggles between 中文 and 中英 for the current session.

patch:
  "switches/+":
    - name: bilingual_output
      states: [ 中文, 中英 ]
      reset: 1
    - name: mixed_input
      states: [ 单语, 混输 ]
      reset: 1
    - name: auto_spacing
      states: [ 原样, 空格 ]
      reset: 1

  # Run before ascii_composer as well as key_binder, so the Shift modifier is
  # handled as part of this shortcut instead of as an ASCII mode switch.
  "engine/processors/@before 1": lua_processor@*bilingual_commit_processor
  "engine/processors/@before 2": lua_processor@*ascii_spacing_processor
  "engine/processors/@before 5": lua_processor@*smart_enter
  # Run after smart_enter but before librime's built-in selector. The keeper
  # delegates navigation to a native selector and snapshots its actual result.
  "engine/processors/@before 6": lua_processor@*selection_keeper
  "engine/translators/+":
    - lua_translator@*mixed_input_translator
  "engine/filters/+":
    - lua_filter@*bilingual_filter
    - lua_filter@*mixed_spacing_filter

  "key_binder/bindings/+":
    - { when: always, accept: Control+Shift+b, toggle: bilingual_output }
    - { when: always, accept: Control+Shift+m, toggle: mixed_input }
    - { when: always, accept: Control+Shift+s, toggle: auto_spacing }

  # Rime userdb learns selections, but its decayed dynamic weight is not a raw
  # commit-count sort. Keep explicit personal exceptions in this small pin layer.
  "pin_cand_filter/+":
    - "you\t有"

  bilingual/max_candidates: 5
  bilingual/max_comment_length: 42
  mixed_input/max_candidates: 3
